async function einlesen(lesen) {
  const fehler = $("#import-fehler");
  if (fehler) fehler.textContent = "";
  try {
    const erg = await lesen();
    const plan = abgleichPlanen(erg);
    if (brauchtPruefung(plan)) abgleichOeffnen(plan);
    else importFertig(abgleichAnwenden(plan), erg);
  } catch (e) {
    const f = $("#import-fehler");
    const d = $("details.import"); if (d) d.open = true;
    if (f) f.textContent = e.message;
    else melde(e.message);
  }
}

function importFertig(s, erg) {
  const teile = [];
  if (s.neu) teile.push(`${s.neu} neu`);
  if (s.alt) teile.push(`${s.alt} bekannt`);
  if (s.raus) teile.push(`${s.raus} nicht mehr dabei`);
  melde(`Liste eingelesen: ${teile.join(", ")}, ${erg.tage.length} ${erg.tage.length === 1 ? "Tag" : "Tage"}`);
  const d = $("details.import"); if (d) d.open = false;
  zeichnen();
}

async function pdfEinlesen(datei) {
  if (!datei.size) { einlesen(() => { throw new Error("Die gewählte Datei ist leer."); }); return; }
  const lbl = $("#lbl-pdf");
  const text = lbl ? lbl.firstChild.textContent : "";
  if (lbl) { lbl.firstChild.textContent = "PDF wird gelesen… "; lbl.setAttribute("aria-busy", "true"); }
  try {
    await einlesen(async () => pdfLesen(await datei.arrayBuffer()));
  } finally {
    const l = $("#lbl-pdf");
    if (l) { l.firstChild.textContent = text || "PDF wählen"; l.removeAttribute("aria-busy"); }
  }
}

/* ============================================================ PDF lesen */

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function skriptLaden(src) {
  return new Promise((ok, nein) => {
    const sc = document.createElement("script");
    sc.src = src;
    sc.onload = ok;
    sc.onerror = () => nein(new Error("Das PDF-Modul konnte nicht geladen werden. Internetverbindung prüfen oder die Tabelle stattdessen kopieren und einfügen."));
    document.head.appendChild(sc);
  });
}

/* Der Worker wird als normales Skript geladen. pdf.js arbeitet dann ohne
   separaten Hintergrund-Thread - das ist bei einer Seite Anwesenheitsliste
   schnell genug und funktioniert auch dort, wo Web Worker blockiert sind
   (abgeschottete Vorschauen, strenge Sicherheitsrichtlinien). */
async function pdfBibliothek() {
  if (!window.pdfjsLib) await skriptLaden(PDFJS);
  if (!window.pdfjsWorker) await skriptLaden(PDFJS_WORKER);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  return window.pdfjsLib;
}

function mitZeitlimit(versprechen, ms, text) {
  let t;
  return Promise.race([
    versprechen.finally(() => clearTimeout(t)),
    new Promise((_, nein) => { t = setTimeout(() => nein(new Error(text)), ms); })
  ]);
}

/* Textstuecke in ein einheitliches Leseraster bringen.
   Je nach Programm liegt der Text in der PDF um 90, 180 oder 270 Grad
   gedreht oder gespiegelt vor. Die Leserichtung der Buchstaben selbst
   verraet die Drehung - danach wird alles so gedreht, dass Text von links
   nach rechts und Zeilen von oben nach unten laufen. */
function ausrichten(items, vp, lib) {
  const roh = items.filter(i => i.str && i.str.trim()).map(i => {
    const m = lib.Util.transform(vp.transform, i.transform);
    const q = ((Math.round(Math.atan2(m[1], m[0]) / (Math.PI / 2)) % 4) + 4) % 4;
    return { i, m, q };
  });
  if (!roh.length) return [];
  const zaehl = [0, 0, 0, 0];
  roh.forEach(r => zaehl[r.q]++);
  const q = zaehl.indexOf(Math.max(...zaehl));
  const dreh = (x, y) => q === 0 ? [x, y] : q === 1 ? [y, -x] : q === 2 ? [-x, -y] : [-y, x];

  // Zeigt die "Oben"-Richtung der Buchstaben nach unten, ist die Seite gespiegelt.
  let unten = 0;
  const bereit = roh.filter(r => r.q === q).map(r => {
    const [, uy] = dreh(r.m[2], r.m[3]);
    if (uy > 0) unten++; else unten--;
    return r;
  });
  const spiegel = unten > 0 ? -1 : 1;

  return bereit.map(({ i, m }) => {
    const h = Math.hypot(m[2], m[3]) || Math.hypot(m[0], m[1]) || 10;
    const [x0, y0] = dreh(m[4], m[5]);
    const s0 = i.str.replace(/^\s+/, "");
    const vorn = i.str.length - s0.length;
    const breite = i.width * vp.scale;
    return {
      s: s0.trim(),
      x: x0 + (i.str.length ? breite * vorn / i.str.length : 0),
      y: y0 * spiegel,
      w: breite * s0.trimEnd().length / Math.max(1, i.str.length),
      h
    };
  });
}

/* Manche PDFs zerlegen Woerter in Buchstabengruppen ("T" + "eilnehmer_in").
   Stuecke auf gleicher Grundlinie ohne Luecke werden wieder verbunden. */
function woerter(stuecke) {
  const sortiert = [...stuecke].sort((a, b) => a.y - b.y || a.x - b.x);
  const out = [];
  for (const st of sortiert) {
    const v = out[out.length - 1];
    if (v && Math.abs(st.y - v.y) < Math.min(st.h, v.h) * 0.3 && st.x - (v.x + v.w) < Math.min(st.h, v.h) * 0.15 && st.x >= v.x) {
      v.s += st.s; v.w = Math.max(v.w, st.x + st.w - v.x); v.h = Math.max(v.h, st.h);
    } else out.push({ ...st });
  }
  return out;
}

/* Zeilen bilden: Textstuecke mit fast gleicher Grundlinie gehoeren zusammen */
function zuZeilen(stuecke, toleranz) {
  const sortiert = [...stuecke].sort((a, b) => a.y - b.y || a.x - b.x);
  const zeilen = [];
  for (const st of sortiert) {
    const z = zeilen[zeilen.length - 1];
    if (z && Math.abs(st.y - z.y) <= toleranz) z.teile.push(st);
    else zeilen.push({ y: st.y, teile: [st] });
  }
  zeilen.forEach(z => z.teile.sort((a, b) => a.x - b.x));
  return zeilen;
}

function verbinden(teile) {
  let out = "";
  teile.forEach((t, i) => {
    if (i === 0) { out = t.s; return; }
    const vor = teile[i - 1];
    const luecke = t.x - (vor.x + vor.w);
    const neueZeile = Math.abs(t.y - vor.y) > t.h * 0.5;
    out += neueZeile ? (/-$/.test(out) ? "" : " ")
      : luecke > t.h * 2.5 ? " – " : (luecke > t.h * 0.12 || /[,;]$/.test(out) ? " " : "");
    out += t.s;
  });
  return out.replace(/\s+/g, " ").trim();
}

function kopfErkennen(stuecke) {
  const tn = stuecke.find(t => /^teilnehm/i.test(t.s));
  if (!tn) return null;
  const kopfWort = t => DATUM.test(t.s) || /^(teilnehm|gruppe|bemerk)/i.test(t.s) || /^\d+$|^tn$|^\d+\s*tn$/i.test(t.s);
  const band = stuecke.filter(t => Math.abs(t.y - tn.y) < tn.h * 2.6 && kopfWort(t));
  const tage = band.filter(t => DATUM.test(t.s)).sort((a, b) => a.x - b.x);
  if (!tage.length) return null;
  const gruppe = band.find(t => /^gruppe/i.test(t.s));
  const bem = band.find(t => /^bemerk/i.test(t.s));
  const mitte = t => t.x + t.w / 2;
  const spalten = [];
  if (gruppe) spalten.push({ typ: "gruppe", cx: mitte(gruppe) });
  tage.forEach(t => spalten.push({ typ: "tag", datum: normDatum(t.s.match(DATUM)), cx: mitte(t) }));
  if (bem) spalten.push({ typ: "bem", cx: mitte(bem) });
  spalten.sort((a, b) => a.cx - b.cx);
  // Namen stehen linksbuendig; alles, was links vor der ersten
  // Datenspalte beginnt, gehoert zum Namen.
  const erste = spalten[0], zweite = spalten[1] || spalten[0];
  const abstand = Math.max(20, zweite.cx - erste.cx);
  const nameGrenze = erste.cx - abstand / 2;
  const unterkante = Math.max(...band.map(t => t.y)) + tn.h * 0.4;
  const oberkante = Math.min(...band.map(t => t.y - t.h));
  return { spalten, nameGrenze, unterkante, oberkante, tage: tage.map(t => normDatum(t.s.match(DATUM))), zeilenH: tn.h };
}

async function pdfLesen(puffer) {
  const lib = await pdfBibliothek();
  let doc;
  try {
    doc = await mitZeitlimit(lib.getDocument({ data: puffer }).promise, 20000,
      "Das PDF ließ sich nicht öffnen (Zeitüberschreitung). Bitte die Seite neu laden und es noch einmal versuchen.");
  } catch (e) {
    if (/Zeitüberschreitung/.test(e.message)) throw e;
    throw new Error("Die Datei lässt sich nicht als PDF öffnen (" + (e.name || "Fehler") + "). Bitte die Anwesenheitsliste erneut als PDF speichern.");
  }
  const diag = { seiten: doc.numPages, textstuecke: 0, kopf: false, tage: 0, zeilen: 0, proben: [] };

  let kopf = null, kurs = "";
  const zeilenAlle = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const seite = await doc.getPage(n);
    const vp = seite.getViewport({ scale: 1 });
    const inhalt = await seite.getTextContent();
    // Viewport-Transformation beruecksichtigt gedrehte Seiten (macOS speichert
    // Querformat als hochkant + Rotation).
    const stuecke = woerter(ausrichten(inhalt.items, vp, lib));
    diag.textstuecke += stuecke.length;
    if (diag.proben.length < 12) diag.proben.push(...stuecke.slice(0, 12 - diag.proben.length).map(t => t.s));
    if (!stuecke.length) continue;

    const k = kopfErkennen(stuecke);
    if (k) {
      kopf = kopf || k;
      if (!kurs) {
        const oben = zuZeilen(stuecke.filter(t => t.y < k.oberkante - 2), 3)
          .filter(z => !/anwesenheitsliste|\d{1,2}:\d{2}|^https?:/i.test(verbinden(z.teile)));
        if (oben.length) kurs = verbinden(oben[oben.length - 1].teile);
      }
    }
    if (!kopf) continue;
    const ab = k ? k.unterkante : 0;
    const tabelle = stuecke.filter(t => t.y > ab && !/^https?:\/\//i.test(t.s) && !/^\d+\s*\/\s*\d+$/.test(t.s));
    zuZeilen(tabelle, kopf.zeilenH * 0.45).forEach(z => zeilenAlle.push({ seite: n, ...z }));
  }
  const diagText = () => `Erkannt: ${diag.seiten} Seite(n), ${diag.textstuecke} Textstücke`
    + (diag.kopf ? `, Kopfzeile mit ${diag.tage} Tagen, ${diag.zeilen} Tabellenzeilen` : ", keine Kopfzeile")
    + (diag.proben.length ? `. Erste Texte: ${diag.proben.map(t => "„" + t + "“").join(" ")}` : "");
  if (!diag.textstuecke) throw new Error("Das PDF enthält keinen lesbaren Text, vermutlich ist es eingescannt oder als Bild gespeichert. Bitte die Tabelle im Portal kopieren und einfügen.");
  if (!kopf) throw new Error("Im PDF wurde keine Kopfzeile mit „Teilnehmer_in“ und Datumsangaben gefunden. " + diagText());
  diag.kopf = true; diag.tage = kopf.tage.length; diag.zeilen = zeilenAlle.length;

  const spalteVon = t => {
    if (t.x < kopf.nameGrenze) return { typ: "name" };
    let best = null, d = Infinity;
    for (const sp of kopf.spalten) {
      const dd = Math.abs(t.x + t.w / 2 - sp.cx);
      if (dd < d) { d = dd; best = sp; }
    }
    return best;
  };

  // Zeilen in Zellen zerlegen
  const zeilen = zeilenAlle.map(z => {
    const zellen = { name: [], gruppe: [], bem: [], tag: {} };
    for (const t of z.teile) {
      const sp = spalteVon(t);
      if (sp.typ === "tag") (zellen.tag[sp.datum] = zellen.tag[sp.datum] || []).push(t);
      else zellen[sp.typ].push(t);
    }
    return { seite: z.seite, y: z.y, zellen };
  });

  // Typischen Zeilenabstand bestimmen, um umgebrochene Namen zu erkennen
  const nameZeilen = zeilen.filter(z => z.zellen.name.length);
  const abstaende = [];
  for (let i = 1; i < nameZeilen.length; i++)
    if (nameZeilen[i].seite === nameZeilen[i - 1].seite) abstaende.push(nameZeilen[i].y - nameZeilen[i - 1].y);
  abstaende.sort((a, b) => a - b);
  const zeilenAbstand = abstaende.length ? abstaende[Math.floor(abstaende.length / 2)] : kopf.zeilenH * 2;

  const leute = [];
  let aktuell = null;
  for (const z of zeilen) {
    const hatName = z.zellen.name.length > 0;
    const hoehe = z.zellen.name[0]?.h || kopf.zeilenH;
    const luecke = aktuell ? z.y - aktuell.yLetzte : Infinity;
    const ohneKomma = aktuell && !verbinden(aktuell.name).includes(",");
    const nah = aktuell && aktuell.seite === z.seite && (
      (hatName && (luecke < hoehe * 1.4 || (ohneKomma && luecke < zeilenAbstand * 0.95))) ||
      (!hatName && (z.y - aktuell.y) < zeilenAbstand * 0.8));
    if (hatName && !nah) {
      aktuell = { seite: z.seite, y: z.y, yLetzte: z.y, name: [...z.zellen.name], gruppe: [...z.zellen.gruppe], bem: [...z.zellen.bem], tag: {} };
      for (const [d, t] of Object.entries(z.zellen.tag)) aktuell.tag[d] = [...t];
      leute.push(aktuell);
    } else if (aktuell && nah) {
      if (hatName) aktuell.yLetzte = z.y;
      aktuell.name.push(...z.zellen.name);
      aktuell.gruppe.push(...z.zellen.gruppe);
      aktuell.bem.push(...z.zellen.bem);
      for (const [d, t] of Object.entries(z.zellen.tag)) (aktuell.tag[d] = aktuell.tag[d] || []).push(...t);
    }
  }

  const text = arr => verbinden(arr.sort((a, b) => a.y - b.y || a.x - b.x));
  const ergebnis = leute
    .map(p => ({
      name: text(p.name).replace(/\s*,\s*/g, ", "),
      gruppe: text(p.gruppe),
      bemerkung: text(p.bem),
      werte: Object.fromEntries(kopf.tage.map(d => [d, p.tag[d] ? text(p.tag[d]) : ""]))
    }))
    .filter(p => /[a-zäöüß]/i.test(p.name) && !/^(summe|gesamt|anzahl)\b/i.test(p.name));

  if (!ergebnis.length) throw new Error("Die Kopfzeile wurde erkannt, aber keine Namen. Geschwärzte oder eingescannte Listen lassen sich nicht auslesen, dann bitte die Tabelle im Portal kopieren und einfügen. " + diagText());
  return { tage: kopf.tage, leute: ergebnis, kurs };
}

/* =========================================================== Einteilen */

let einst = { tag: null, modus: "anzahl", wert: 5, variante: 0, label: "" };
let editor = null; // {modus:"neu"|"bearbeiten", id, gruppen, auswahl}

function tagKeyAktuell() {
  if (einst.tag && (einst.tag === "_frei" || Z.tage.includes(einst.tag))) return einst.tag;
  // Heute, sonst der naechste kommende Tag, sonst der letzte Tag der Liste
  const h = heuteStr();
  const heuteS = datumSchluessel(h);
  const kommend = Z.tage.find(d => datumSchluessel(d) >= heuteS);
  einst.tag = Z.tage.includes(h) ? h : (kommend || Z.tage[Z.tage.length - 1] || "_frei");
  return einst.tag;
}

function anwesende(tagKey) {
  return Z.teilnehmer.filter(t => istDa(t, tagKey)).map(t => t.nr);
}

function standardLabel(tagKey) {
  const datum = tagKey === "_frei" ? heuteStr() : tagKey;
  const n = Z.runden.filter(r => r.datum === datum).length + 1;
  return `${datum}, Runde ${n}`;
}

const dlg = () => $("#dlg-einteilen");

function einteilenOeffnen() {
  if (!Z.teilnehmer.length) { melde("Zuerst die Teilnehmerliste einlesen."); zeige("teilnehmer"); return; }
  editor = null; einst.label = ""; einst.variante = 0; einst.tag = null;
  $("#dlg-titel").textContent = "Neue Runde einteilen";
  zeichneEinteilen();
  if (!dlg().open) { dlg().showModal(); verlaufMerken("einteilen"); }
  $("#dlg-inhalt").scrollTop = 0;
}

function bearbeitenOeffnen(id) {
  const r = Z.runden.find(x => x.id === id);
  if (!r) return;
  editor = { modus: "bearbeiten", id, gruppen: r.gruppen.map(g => [...g]), auswahl: null };
  $("#dlg-titel").textContent = "Runde bearbeiten";
  zeichneEinteilen();
  if (!dlg().open) { dlg().showModal(); verlaufMerken("einteilen"); }
  $("#dlg-inhalt").scrollTop = 0;
}

function verwerfenFrage() {
  return editor && editor.modus === "bearbeiten"
    ? "Änderungen an dieser Runde verwerfen?"
    : "Die Einteilung ist noch nicht gespeichert. Verwerfen?";
}

function dialogSchliessen(ohneFrage) {
  if (editor && !ohneFrage && !confirm(verwerfenFrage())) return;
  editor = null;
  verlaufFreigeben();          // sofort, damit folgende Reiterwechsel richtig landen
  if (dlg().open) dlg().close();
}

$("#dlg-zu").onclick = () => dialogSchliessen();
dlg().addEventListener("cancel", e => { e.preventDefault(); dialogSchliessen(); });
dlg().addEventListener("close", () => { editor = null; verlaufFreigeben(); zeichnen(); });

function zeichneEinteilen() {
  const el = $("#dlg-inhalt");
  const bearbeiten = editor && editor.modus === "bearbeiten";

  if (bearbeiten) {
    const r = Z.runden.find(x => x.id === editor.id);
    el.innerHTML = `
      <div class="feld">
        <div class="einstell">
          <div>
            <label class="titel" for="bearb-label">Bezeichnung</label>
            <input type="text" id="bearb-label" name="bezeichnung" autocomplete="off" value="${esc(r.label)}" style="width:100%">
          </div>
          <div>
            <label class="titel" for="bearb-zeit">Uhrzeit</label>
            <input type="time" id="bearb-zeit" name="uhrzeit" autocomplete="off" value="${esc(r.zeit || "")}">
          </div>
          <div>
            <span class="titel">Tag</span>
            <span>${esc(r.datum)}</span>
          </div>
        </div>
      </div>
      <div id="vorschau"></div>`;
    zeichneVorschau();
    zeichneFuss();
    return;
  }

  const tagKey = tagKeyAktuell();
  const da = anwesende(tagKey);
  const sizes = da.length ? groessen(da.length, einst.modus, einst.wert) : [];
  if (!einst.label) einst.label = standardLabel(tagKey);

  el.innerHTML = `
    <div class="feld">
      <div class="einstell">
        <div>
          <label class="titel" for="sel-tag">Tag</label>
          <select id="sel-tag" name="tag">
            ${Z.tage.map(d => `<option value="${esc(d)}" ${d === tagKey ? "selected" : ""}>${esc(d)}${d === heuteStr() ? " (heute)" : ""}</option>`).join("")}
            <option value="_frei" ${tagKey === "_frei" ? "selected" : ""}>ohne Tagesbezug</option>
          </select>
        </div>
        <div>
          <span class="titel" id="aufteilung-titel">Aufteilung</span>
          <div class="zeile">
            <div class="segment" role="group" aria-labelledby="aufteilung-titel">
              <button id="m-anzahl" aria-pressed="${einst.modus === "anzahl"}">Gruppenzahl</button>
              <button id="m-groesse" aria-pressed="${einst.modus === "groesse"}">Gruppengröße</button>
            </div>
            <input type="number" id="wert" name="wert" inputmode="numeric" autocomplete="off" min="1" max="${Math.max(1, da.length)}" value="${einst.wert}"
              aria-label="${einst.modus === "anzahl" ? "Anzahl der Gruppen" : "Personen pro Gruppe"}">
          </div>
          <div class="groessen">${sizes.length ? `${sizes.length} ${sizes.length === 1 ? "Gruppe" : "Gruppen"}: ${sizes.join(" + ")}` : "Niemand anwesend"}</div>
        </div>
        <div>
          <label class="titel" for="label">Bezeichnung</label>
          <input type="text" id="label" name="bezeichnung" autocomplete="off" value="${esc(einst.label)}" style="width:100%">
        </div>
      </div>
    </div>

    <div class="feld">
      <div class="zeile" style="justify-content:space-between; margin-bottom:10px">
        <h3>Anwesend: ${da.length} von ${Z.teilnehmer.filter(t => t.inListe !== false).length}</h3>
        <button class="knopf" id="btn-anw-reset" ${Z.korrektur[tagKey] ? "" : "disabled"}>Auf Tabelle zurücksetzen</button>
      </div>
      <p class="hilfe" style="margin-bottom:10px">Antippen, um jemanden an- oder abzumelden, z. B. wenn jemand früher geht.</p>
      <div class="anwesenheit">
        ${Z.teilnehmer.filter(t => t.inListe !== false).map(t => {
          const ist = istDa(t, tagKey);
          const zusatz = tagKey !== "_frei" && entschuldigt(t.werte?.[tagKey]) ? esc(t.werte[tagKey]) : "";
          return `<button class="anw" data-nr="${t.nr}" aria-pressed="${ist}">
            <span class="nr">${t.nr}</span><span class="name">${esc(anzeigeName(t))}</span>
            ${zusatz ? `<span class="zusatz">${zusatz}</span>` : ""}
          </button>`;
        }).join("")}
      </div>
    </div>

    <div id="vorschau"></div>`;

  // Jede Aenderung an den Eingaben verwirft eine bestehende Vorschau
  const neu = () => { editor = null; einst.variante = 0; zeichneEinteilen(); };
  $("#sel-tag").onchange = e => { einst.tag = e.target.value; einst.label = ""; neu(); };
  $("#m-anzahl").onclick = () => { einst.modus = "anzahl"; neu(); };
  $("#m-groesse").onclick = () => { einst.modus = "groesse"; neu(); };
  $("#wert").onchange = e => { einst.wert = Math.max(1, parseInt(e.target.value) || 1); neu(); };
  $("#label").oninput = e => { einst.label = e.target.value; };
  $("#btn-anw-reset").onclick = () => { delete Z.korrektur[tagKey]; speichern(); neu(); };
  el.querySelectorAll(".anw").forEach(b => b.onclick = () => {
    const nr = +b.dataset.nr;
    const t = Z.teilnehmer.find(p => p.nr === nr);
    Z.korrektur[tagKey] = Z.korrektur[tagKey] || {};
    Z.korrektur[tagKey][nr] = !istDa(t, tagKey);
    speichern();
    const pos = $("#dlg-inhalt").scrollTop;
    neu();
    $("#dlg-inhalt").scrollTop = pos;
    const knopf = $(`.anw[data-nr="${nr}"]`); if (knopf) knopf.focus();
  });
  zeichneVorschau();
  zeichneFuss();
}

function zeichneFuss() {
  const f = $("#dlg-fuss");
  if (editor && editor.modus === "bearbeiten") {
    f.innerHTML = `
      <button class="knopf" id="f-abbr">Abbrechen</button>
      <span class="platz"></span>
      <button class="knopf haupt" id="f-aendern">Änderungen speichern</button>`;
    $("#f-abbr").onclick = () => dialogSchliessen();
    $("#f-aendern").onclick = () => {
      const r = Z.runden.find(x => x.id === editor.id);
      r.gruppen = editor.gruppen.filter(g => g.length).map(g => [...g].sort((a, b) => a - b));
      const zeit = $("#bearb-zeit").value;
      if (zeit) r.zeit = zeit; else delete r.zeit;
      const label = $("#bearb-label").value.trim();
      if (label) r.label = label;
      speichern(); dialogSchliessen(true); melde("Änderungen gespeichert");
    };
    return;
  }
  const da = anwesende(tagKeyAktuell());
  f.innerHTML = `
    <button class="knopf" id="f-abbr">Abbrechen</button>
    <span class="platz">${editor ? "" : `<span class="hinweis">${da.length} Personen anwesend</span>`}</span>
    <button class="knopf ${editor ? "" : "haupt"}" id="f-rechnen" ${da.length ? "" : "disabled"}>${editor ? "Andere Variante" : "Gruppen berechnen"}</button>
    ${editor ? `<button class="knopf haupt" id="f-speichern">Runde speichern</button>` : ""}`;
  $("#f-abbr").onclick = () => dialogSchliessen();
  $("#f-rechnen").onclick = () => { if (editor) einst.variante++; else einst.variante = 0; berechnen(); };
  const sp = $("#f-speichern");
  if (sp) sp.onclick = () => {
    const id = Z.runden.reduce((m, x) => Math.max(m, x.id), 0) + 1;
    const datum = editor.tagKey === "_frei" ? heuteStr() : editor.tagKey;
    Z.runden.push({
      id, datum,
      zeit: jetztZeit(),
      gespeichert: new Date().toISOString(),
      kurs: Z.kurs || "",
      label: (einst.label || standardLabel(editor.tagKey)).trim(),
      gruppen: editor.gruppen.filter(g => g.length).map(g => [...g].sort((a, b) => a - b)),
      fehlend: editor.fehlend
    });
    speichern();
    einst.label = ""; einst.variante = 0;
    offeneRunden = null;   // nur die neue (juengste) Runde aufgeklappt
    dialogSchliessen(true);
    zeige("runden");
    melde("Runde gespeichert");
  };
}

function berechnen() {
  const tagKey = tagKeyAktuell();
  const da = anwesende(tagKey);
  if (!da.length) return;
  const sizes = groessen(da.length, einst.modus, einst.wert);
  const z = zaehler(null);
  editor = { modus: "neu", gruppen: einteilen(da, sizes, z, einst.variante, sperrSet()), auswahl: null, tagKey, fehlend: Z.teilnehmer.filter(t => !da.includes(t.nr)).map(t => t.nr) };
  zeichneVorschau();
  zeichneFuss();
  const v = $("#vorschau");
  if (v) v.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  const sp = $("#f-speichern"); if (sp) sp.focus({ preventScroll: true });
}

function gruppenHTML(gruppen, z, bearbeitbar, auswahl) {
  const markeVon = nr => {
    let max = 0;
    for (const g of gruppen) if (g.includes(nr)) for (const o of g) if (o !== nr) max = Math.max(max, z.get(pk(nr, o)) || 0);
    return max;
  };
  const sp = bearbeitbar ? sperrSet() : new Set();
  const gesperrtIn = (nr, g) => g.filter(o => o !== nr && sp.has(pk(nr, o)));
  return `<div class="gruppen ${bearbeitbar ? "bearbeitbar" : ""}">
    ${gruppen.map((g, gi) => `
      <div class="gruppe ${bearbeitbar && auswahl && auswahl.g !== gi ? "ziel" : ""}" data-g="${gi}">
        <div class="gkopf">
          ${bearbeitbar ? `<button class="gziel" data-g="${gi}" title="Ausgewählte Person hierher verschieben">Gruppe ${gi + 1}</button>` : `<h3>Gruppe ${gi + 1}</h3>`}
          <span class="anzahl">${g.length} Pers.</span>
        </div>
        <ul>
          ${g.map((nr, pi) => {
            const m = markeVon(nr);
            const gew = auswahl && auswahl.g === gi && auswahl.p === pi;
            return `<li><button class="person ${gew ? "gewaehlt" : ""}" data-g="${gi}" data-p="${pi}" ${bearbeitbar ? "" : "tabindex='-1'"}>
              <span class="nr">${nr}</span><span>${esc(nameVon(nr))}</span>
              ${gesperrtIn(nr, g).length
                ? `<span class="marke sp" title="soll nicht mit ${gesperrtIn(nr, g).map(nameVon).map(esc).join(", ")} in eine Gruppe" aria-label="Sperrpaar in dieser Gruppe">!</span>`
                : m ? `<span class="marke ${m >= 2 ? "w2" : "w1"}" title="saß schon ${m}× mit jemandem hier zusammen"></span>` : ""}
            </button></li>`;
          }).join("")}
        </ul>
      </div>`).join("")}
  </div>`;
}

function sperrWarnungHTML(gruppen) {
  const v = sperrVerstoesse(gruppen);
  return v.length ? `<div class="bilanz warnung" role="alert"><strong>${v.length === 1 ? "Ein Sperrpaar sitzt" : v.length + " Sperrpaare sitzen"} in derselben Gruppe</strong>
    <ul>${v.map(([a, b]) => `<li>${a} ${esc(nameVon(a))} und ${b} ${esc(nameVon(b))}</li>`).join("")}</ul>
    ${editor && editor.modus === "neu" && !editor.manuell ? `<p style="margin:6px 0 0">Mit dieser Anwesenheit und Gruppenzahl ließ sich das nicht vermeiden. Eine andere Gruppenzahl hilft oft.</p>` : ""}</div>` : "";
}

function bilanzHTML(gruppen, z) {
  const w = wiederholungen(gruppen, z);
  if (!w.length) return `<div class="bilanz gut">Keine Wiederbegegnungen, alle Paarungen sind neu.</div>`;
  return `<div class="bilanz"><strong>${w.length} Wiederbegegnung${w.length === 1 ? "" : "en"}</strong>
    <ul>${w.map(x => `<li>${x.a} ${esc(nameVon(x.a))} und ${x.b} ${esc(nameVon(x.b))}: bisher ${x.k}× zusammen</li>`).join("")}</ul></div>`;
}

function zeichneVorschau() {
  const v = $("#vorschau");
  if (!v) return;
  if (!editor) { v.innerHTML = ""; return; }
  const z = zaehler(editor.modus === "bearbeiten" ? editor.id : null);
  v.innerHTML = `
    <h2 style="margin-top:4px">${editor.modus === "bearbeiten" ? "Gruppen" : "Vorschau"}</h2>
    <p class="hilfe">Person antippen, dann eine Person in einer anderen Gruppe zum Tauschen,
      oder den Gruppennamen zum Verschieben.</p>
    ${sperrWarnungHTML(editor.gruppen)}
    ${gruppenHTML(editor.gruppen, z, true, editor.auswahl)}
    ${bilanzHTML(editor.gruppen, z)}`;
  v.querySelectorAll(".person").forEach(b => b.onclick = () => personKlick(+b.dataset.g, +b.dataset.p));
  v.querySelectorAll(".gziel").forEach(b => b.onclick = () => gruppeKlick(+b.dataset.g));
}

function personKlick(g, p) {
  const a = editor.auswahl;
  if (!a) editor.auswahl = { g, p };
  else if (a.g === g && a.p === p) editor.auswahl = null;
  else if (a.g === g) editor.auswahl = { g, p };
  else {
    const G = editor.gruppen;
    [G[a.g][a.p], G[g][p]] = [G[g][p], G[a.g][a.p]];
    editor.manuell = true;
    G[a.g].sort((x, y) => x - y); G[g].sort((x, y) => x - y);
    editor.auswahl = null;
  }
  zeichneVorschau();
}

function gruppeKlick(g) {
  const a = editor.auswahl;
  if (!a || a.g === g) return;
  const G = editor.gruppen;
  if (G[a.g].length <= 1) { melde("Eine Gruppe braucht mindestens eine Person"); return; }
  const [nr] = G[a.g].splice(a.p, 1);
  editor.manuell = true;
  G[g].push(nr); G[g].sort((x, y) => x - y);
  editor.auswahl = null;
  zeichneVorschau();
}

/* ============================================================== Runden */

let offeneRunden = null;   // null = Standard: nur die juengste Runde offen
let offeneModule = null;   // null = Standard: nur das Modul der juengsten Runde offen

function zeichneRunden() {
  const el = $("#tab-runden");
  if (!Z.teilnehmer.length) {
    el.innerHTML = `<div class="leer"><p>Noch keine Teilnehmenden. Zuerst die Liste einlesen.</p>
      <button class="knopf haupt" onclick="zeige('teilnehmer')">Zur Teilnehmerliste</button></div>`;
    return;
  }
  if (!Z.runden.length) {
    el.innerHTML = `<div class="leer"><p>Noch keine Runden gespeichert.</p>
      <button class="knopf haupt" id="btn-neu-leer">Erste Runde einteilen</button></div>`;
    $("#btn-neu-leer").onclick = einteilenOeffnen;
    return;
  }
  const reihe = chronologisch();
  const juengste = reihe[reihe.length - 1].id;
  const offen = id => offeneRunden ? offeneRunden.has(id) : id === juengste;

  // Module in der Reihenfolge ihres ersten Auftretens
  const modulName = r => (r.kurs || "").trim();
  const module = [];
  reihe.forEach(r => { const m = modulName(r); if (!module.includes(m)) module.push(m); });
  const mitModulen = module.length > 1;
  const juengstesModul = modulName(reihe[reihe.length - 1]);
  const modulOffen = m => offeneModule ? offeneModule.has(m) : m === juengstesModul;

  const rundeHTML = (r, idx, ebene) => {
    // nur Runden VOR dieser zaehlen fuer die Markierung
    const vorher = new Map();
    for (const q of reihe.slice(0, idx)) for (const g of q.gruppen)
      for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) {
        const k = pk(g[i], g[j]); vorher.set(k, (vorher.get(k) || 0) + 1);
      }
    const w = wiederholungen(r.gruppen, vorher).length;
    return `
      <details class="runde" data-id="${r.id}" ${offen(r.id) ? "open" : ""}>
        <summary>
          <span class="pfeil" aria-hidden="true"></span>
          <span class="rtext">
          <h${ebene} class="rtitel">${esc(r.label)}</h${ebene}>
          <span class="meta">${r.zeit ? `<time>${esc(r.zeit)}</time>&nbsp;Uhr, ` : ""}${r.gruppen.length} Gruppen, ${r.gruppen.reduce((s, g) => s + g.length, 0)} Personen,
            ${w ? `${w} Wiederbegegnung${w === 1 ? "" : "en"}` : "keine Wiederbegegnungen"}</span>
          </span>
        </summary>
        <div class="runde-inhalt">
          <div class="zeile aktionen keindruck">
            <button class="knopf" data-bearb="${r.id}">Bearbeiten</button>
            <button class="knopf gefahr" data-loesch="${r.id}">Löschen</button>
          </div>
          ${gruppenHTML(r.gruppen, vorher, false, null)}
        </div>
      </details>`;
  };

  const tageHTML = (runden, tagEbene) => {
    let letzterTag = null, h = "";
    runden.forEach(r => {
      if (r.datum !== letzterTag) { h += `<h${tagEbene} class="tag-trenner">${esc(r.datum)}</h${tagEbene}>`; letzterTag = r.datum; }
      h += rundeHTML(r, reihe.indexOf(r), tagEbene + 1);
    });
    return h;
  };

  let html = "";
  if (mitModulen) {
    module.forEach(m => {
      const rr = reihe.filter(r => modulName(r) === m);
      const von = rr[0].datum, bis = rr[rr.length - 1].datum;
      html += `
        <details class="modul" data-modul="${esc(m)}" ${modulOffen(m) ? "open" : ""}>
          <summary>
            <span class="pfeil" aria-hidden="true"></span>
            <span class="rtext">
              <h2>${m ? esc(m) : "Ohne Modulangabe"}</h2>
              <span class="meta">${rr.length} Runde${rr.length === 1 ? "" : "n"}, ${esc(von)}${bis !== von ? " bis " + esc(bis) : ""}</span>
            </span>
          </summary>
          <div class="modul-inhalt">${tageHTML(rr, 3)}</div>
        </details>`;
    });
  } else {
    html = tageHTML(reihe, 2);
  }

  el.innerHTML = `
    <div class="rundenkopf keindruck">
      <h2>${Z.runden.length} gespeicherte Runde${Z.runden.length === 1 ? "" : "n"}</h2>
      <div class="zeile">
        <button class="knopf" id="btn-alle">${reihe.every(r => offen(r.id)) ? "Alle einklappen" : "Alle ausklappen"}</button>
        <button class="knopf gefahr" id="btn-letzte">Letzte Runde löschen</button>
        <button class="knopf haupt" id="btn-neu">Neue Runde einteilen</button>
      </div>
    </div>
    ${html}`;

  $("#btn-neu").onclick = einteilenOeffnen;
  $("#btn-alle").onclick = () => {
    const alleOffen = reihe.every(r => offen(r.id));
    offeneRunden = new Set(alleOffen ? [] : reihe.map(r => r.id));
    zeichneRunden();
  };
  el.querySelectorAll("details.modul").forEach(d => d.addEventListener("toggle", () => {
    if (!offeneModule) offeneModule = new Set([juengstesModul]);
    if (d.open) offeneModule.add(d.dataset.modul); else offeneModule.delete(d.dataset.modul);
  }));
  el.querySelectorAll("details.runde").forEach(d => d.addEventListener("toggle", () => {
    if (!offeneRunden) offeneRunden = new Set([juengste]);
    const id = +d.dataset.id;
    if (d.open) offeneRunden.add(id); else offeneRunden.delete(id);
    const alle = $("#btn-alle");
    if (alle) alle.textContent = reihe.every(r => offeneRunden.has(r.id)) ? "Alle einklappen" : "Alle ausklappen";
  }));
  $("#btn-letzte").onclick = () => {
    const r = Z.runden[Z.runden.length - 1];
    if (!confirm(`„${r.label}“ löschen?`)) return;
    Z.runden.pop(); offeneRunden = null; speichern(); melde("Letzte Runde gelöscht"); zeichnen();
  };
  el.querySelectorAll("[data-loesch]").forEach(b => b.onclick = () => {
    const id = +b.dataset.loesch;
    const r = Z.runden.find(x => x.id === id);
    if (!confirm(`„${r.label}“ löschen?`)) return;
    Z.runden = Z.runden.filter(x => x.id !== id);
    if (offeneRunden) offeneRunden.delete(id);
    speichern(); melde("Runde gelöscht"); zeichnen();
  });
  el.querySelectorAll("[data-bearb]").forEach(b => b.onclick = () => bearbeitenOeffnen(+b.dataset.bearb));
}

/* Beim Drucken alle Runden aufklappen, danach wieder wie vorher */
let vorDruck = null;
window.addEventListener("beforeprint", () => {
  vorDruck = [...document.querySelectorAll("details.runde, details.modul")].map(d => [d, d.open]);
  vorDruck.forEach(([d]) => d.open = true);
});
window.addEventListener("afterprint", () => {
  if (vorDruck) vorDruck.forEach(([d, o]) => d.open = o);
  vorDruck = null;
});

/* ============================================================== Matrix */

let matrixEhemalige = false;

function zeichneMatrix() {
  const el = $("#tab-matrix");
  const hatEhemalige = Z.teilnehmer.some(t => t.inListe === false);
  const leute = Z.teilnehmer.filter(t => matrixEhemalige || t.inListe !== false);
  const sichtbar = new Set(leute.map(t => t.nr));
  if (!leute.length || !Z.runden.length) {
    el.innerHTML = `<div class="leer"><p>Die Matrix erscheint, sobald mindestens eine Runde gespeichert ist.</p></div>`;
    return;
  }
  const z = zaehler(null);

  // Ueblicher Wert = Median ueber alle Paare der aktuellen Teilnehmenden.
  // Neue oder lange Abwesende liegen darunter und verfaelschen so nichts.
  const aktiveNr = Z.teilnehmer.filter(t => t.inListe !== false).map(t => t.nr);
  const werte = [];
  for (let i = 0; i < aktiveNr.length; i++) for (let j = i + 1; j < aktiveNr.length; j++)
    werte.push(z.get(pk(aktiveNr[i], aktiveNr[j])) || 0);
  werte.sort((x, y) => x - y);
  const basis = werte.length ? werte[Math.floor((werte.length - 1) / 2)] : 0;
  const stufe = k => Math.max(0, Math.min(4, k - basis));

  const zaehlStufen = [0, 0, 0, 0, 0];
  const paare = [];
  for (let i = 0; i < leute.length; i++) for (let j = i + 1; j < leute.length; j++) {
    const a = leute[i].nr, b = leute[j].nr, k = z.get(pk(a, b)) || 0, st = stufe(k);
    zaehlStufen[st]++;
    if (st >= 2) paare.push({ a: Math.min(a, b), b: Math.max(a, b), k, st });
  }
  paare.sort((x, y) => y.k - x.k || x.a - y.a || x.b - y.b);
  const darueber = zaehlStufen.slice(1).reduce((s, n) => s + n, 0);
  const stufenText = [1, 2, 3, 4].filter(i => zaehlStufen[i])
    .map(i => `${zaehlStufen[i]} ${zaehlStufen[i] === 1 ? "Paar" : "Paare"} ${i === 4 ? "4× oder mehr" : i + "×"} darüber`).join(", ");

  el.innerHTML = `
    <h2>Wer saß wie oft mit wem zusammen</h2>
    <p class="hilfe">${Z.runden.length} Runden. Üblich sind ${basis}× zusammen.
      ${darueber ? stufenText + "." : "Alle Paare liegen im üblichen Bereich."}</p>
    <div class="zeile" style="justify-content:space-between; align-items:center">
      <div class="legende" aria-label="Farblegende">
        <span class="l0">bis ${basis}× (üblich)</span>
        <span class="l1">${basis + 1}×</span>
        <span class="l2">${basis + 2}×</span>
        <span class="l3">${basis + 3}×</span>
        <span class="l4">ab ${basis + 4}×</span>
      </div>
      ${hatEhemalige ? `<label class="inline keindruck" style="cursor:pointer">
        <input type="checkbox" id="mx-ehemalige" name="ehemalige" ${matrixEhemalige ? "checked" : ""} style="accent-color:var(--akzent); width:18px; height:18px">
        Ehemalige anzeigen</label>` : ""}
    </div>
    <div class="rolle">
      <table class="matrix">
        <thead><tr><th class="namen">Teilnehmende</th>${leute.map(t => `<th>${t.nr}</th>`).join("")}</tr></thead>
        <tbody>
          ${leute.map(a => `<tr>
            <td class="namen"><span class="nr" style="font-size:.8rem">${a.nr}</span> ${esc(anzeigeName(a))}</td>
            ${leute.map(b => {
              if (a.nr === b.nr) return `<td class="diag"></td>`;
              const k = z.get(pk(a.nr, b.nr)) || 0;
              const st = stufe(k);
              return `<td class="${k === 0 ? "k0" : ""} ${st ? "s" + st : ""}">${k}</td>`;
            }).join("")}
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    ${paare.length ? `
      <div class="feld" style="margin-top:20px">
        <h3>Deutlich häufiger als üblich</h3>
        <p class="hilfe">Mindestens 2× öfter zusammen als der übliche Wert. Beim Einteilen werden diese Paare ohnehin gemieden.</p>
        <ul>${paare.map(p => `<li>${p.a} ${esc(nameVon(p.a))} und ${p.b} ${esc(nameVon(p.b))}: ${p.k}×</li>`).join("")}</ul>
      </div>` : ""}`;
  const cb = $("#mx-ehemalige");
  if (cb) cb.onchange = e => { matrixEhemalige = e.target.checked; zeichneMatrix(); $("#mx-ehemalige").focus(); };
}

    <div class="feld">

/* ====================================================== Teilnehmer*in */

let tnAktuell = null;
function tnZu() { verlaufFreigeben(); if ($("#dlg-tn").open) $("#dlg-tn").close(); }

function tnBearbeiten(nr) {
  const t = Z.teilnehmer.find(p => p.nr === nr);
  if (!t) return;
  tnAktuell = nr;
  $("#dlg-tn-inhalt").innerHTML = `
    <div class="tn-kopf"><span class="nr">${t.nr}</span><strong>${esc(t.name)}</strong></div>

    <p class="hilfe" style="margin:10px 0 0">Wird in Gruppen, Anwesenheit und Matrix statt des Namens angezeigt.
      Leer lassen, um den Namen aus der Liste zu verwenden. Bleibt beim erneuten Einlesen der Liste erhalten.</p>
    <fieldset class="wahlgruppe" style="margin-top:20px">
      <legend class="titel" style="font-weight:700; margin-bottom:4px">Nie in eine Gruppe mit</legend>

      <div class="sperr-liste">
        ${Z.teilnehmer.filter(o => o.nr !== t.nr && o.inListe !== false).map(o => `
          <label><input type="checkbox" name="sperre" value="${o.nr}" ${gesperrtMit(t.nr).includes(o.nr) ? "checked" : ""}>

  $("#dlg-tn-inhalt").scrollTop = 0;
  f.focus(); f.select();
}

function tnSpeichern() {
  const t = Z.teilnehmer.find(p => p.nr === tnAktuell);
  if (t) {
    const wert = $("#tn-spitzname").value.replace(/\s+/g, " ").trim();
    const spitzVorher = t.spitzname || "";
    if (wert) t.spitzname = wert; else delete t.spitzname;
    const vorher = gesperrtMit(t.nr).sort().join(",");
    document.querySelectorAll('#dlg-tn-inhalt input[name="sperre"]').forEach(cb => sperrpaarSetzen(t.nr, +cb.value, cb.checked));
    const nachher = gesperrtMit(t.nr).sort().join(",");
    speichern();
    melde(vorher !== nachher ? "Änderungen gespeichert" : (wert !== spitzVorher ? (wert ? `Spitzname „${wert}“ gespeichert` : "Spitzname entfernt") : "Keine Änderungen"));
  }
  tnZu();
}

$("#dlg-tn-ok").onclick = tnSpeichern;
$("#dlg-tn-abbr").onclick = () => tnZu();
$("#dlg-tn-zu").onclick = () => tnZu();
$("#dlg-tn").addEventListener("close", () => {

  const nr = tnAktuell; tnAktuell = null;
  zeichnen();
  const b = document.querySelector(`[data-tn="${nr}"]`); if (b) b.focus();
});

/* ========================================================= Abgleich-Fenster */

let abgleichPlan = null;

function abgleichOeffnen(plan) {
  abgleichPlan = plan;
  const kursNeu = plan.erg.kurs && Z.kurs && namensSchluessel(plan.erg.kurs) !== namensSchluessel(Z.kurs);
  $("#dlg-abgleich-titel").textContent = kursNeu ? "Neues Modul einlesen" : "Liste abgleichen";
  abgleichZeichnen();
  const d = $("#dlg-abgleich");
  if (!d.open) { d.showModal(); verlaufMerken("abgleich"); }
  $("#dlg-abgleich-inhalt").scrollTop = 0;
}

function abgleichZu() {
  abgleichPlan = null;
  verlaufFreigeben();
  if ($("#dlg-abgleich").open) $("#dlg-abgleich").close();
}

function personKurz(t) {
  return `<span class="nr">${t.nr}</span><span class="pname">${esc(t.name)}${t.spitzname ? ` <span class="altname">„${esc(t.spitzname)}“</span>` : ""}</span>`;
}

function abgleichZeichnen() {
  const plan = abgleichPlan;
  if (!plan) return;
  const { erg } = plan;
  const st = abgleichStand(plan);
  const kursNeu = erg.kurs && Z.kurs && namensSchluessel(erg.kurs) !== namensSchluessel(Z.kurs);
  const nachNr = nr => Z.teilnehmer.find(t => t.nr === nr);

  // Zeilen mit Vorschlag zuerst, danach alphabetisch
  const zeilen = plan.offen.map((o, i) => ({ o, i }))
    .sort((a, b) => (b.o.vorschlag ? 1 : 0) - (a.o.vorschlag ? 1 : 0) || a.o.p.name.localeCompare(b.o.p.name, "de"));

  $("#dlg-abgleich-inhalt").innerHTML = `
    <div class="feld">
      ${kursNeu ? `<p class="modulwechsel"><strong>${esc(erg.kurs)}</strong><span>bisher: ${esc(Z.kurs)}</span></p>` : ""}
      <p class="hilfe" style="margin:0">${erg.tage.length} ${erg.tage.length === 1 ? "Tag" : "Tage"}: ${erg.tage.map(esc).join(", ")}.
        Bisherige Runden, Nummern und Spitznamen bleiben erhalten und zählen beim Einteilen weiter mit.</p>
      <ul class="bilanzzahlen">
        <li><strong>${st.wieder}</strong> wiedererkannt</li>
        ${st.zurueck.length ? `<li><strong>${st.zurueck.length}</strong> wieder dabei</li>` : ""}
        <li><strong>${st.neu.length}</strong> neu</li>
        <li><strong>${st.gehen.length}</strong> nicht mehr dabei</li>
      </ul>
    </div>

    ${plan.offen.length ? `
    <div class="feld">
      <h3>Zuordnung prüfen</h3>
      <p class="hilfe">Diese Namen stehen so noch nicht in der bisherigen Liste. Wenn es dieselbe Person ist, zum Beispiel nach einer
        Namensänderung oder bei einem Tippfehler, hier die bisherige Person wählen – dann bleiben Nummer und Begegnungen erhalten.</p>
      <div class="abgl-liste">
        ${zeilen.map(({ o, i }) => {
          const fehler = o.wahl && st.doppelt.has(o.wahl);
          return `
          <div class="abgl-zeile ${fehler ? "fehlerhaft" : ""}">
            <div class="abgl-neu">
              <span class="etikett">Neue Liste</span>
              <strong>${esc(o.p.name)}</strong>
            </div>
            <div class="abgl-wahl">
              <label class="etikett" for="abgl-${i}">Ist dieselbe Person wie</label>
              <select id="abgl-${i}" name="abgl-${i}" data-i="${i}">
                <option value="" ${!o.wahl ? "selected" : ""}>Niemand – neue Person</option>
                <optgroup label="Bisherige Teilnehmende">
                  ${o.kandidaten.map(k => {
                    const t = nachNr(k.nr);
                    const zusatz = [t.inListe === false ? "ehemalig" : "", k.s >= 0.75 ? "ähnlich" : ""].filter(Boolean).join(", ");
                    return `<option value="${k.nr}" ${o.wahl === k.nr ? "selected" : ""}>${k.nr} ${esc(t.name)}${zusatz ? ` (${zusatz})` : ""}</option>`;
                  }).join("")}
                </optgroup>
              </select>
              ${o.vorschlag && o.wahl === o.vorschlag ? `<span class="vorschlag">Vorschlag</span>` : ""}
              ${fehler ? `<span class="fehler" style="margin:4px 0 0">Diese Person ist schon einem anderen Namen zugeordnet.</span>` : ""}
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>` : ""}

    ${st.gehen.length ? `
    <div class="feld">
      <h3>Nicht mehr dabei (${st.gehen.length})</h3>
      <p class="hilfe">Stehen nicht in der neuen Liste. Sie werden ausgeblendet, behalten aber Nummer und Begegnungen.
        Taucht jemand in einem späteren Modul wieder auf, wird er wiedererkannt.</p>
      <ul class="personen-liste">${st.gehen.map(t => `<li>${personKurz(t)}</li>`).join("")}</ul>
    </div>` : ""}

    ${st.zurueck.length ? `
    <div class="feld">
      <h3>Wieder dabei (${st.zurueck.length})</h3>
      <ul class="personen-liste">${st.zurueck.map(t => `<li>${personKurz(t)}</li>`).join("")}</ul>
    </div>` : ""}

    ${plan.sicher.length ? `
    <details class="feld ehemalige">
      <summary><span class="pfeil" aria-hidden="true"></span><h3>Wiedererkannt (${plan.sicher.length})</h3></summary>
      <ul class="personen-liste" style="margin-top:10px">${plan.sicher.map(({ nr }) => `<li>${personKurz(nachNr(nr))}</li>`).join("")}</ul>
    </details>` : ""}`;

  $("#dlg-abgleich-inhalt").querySelectorAll("select[data-i]").forEach(sel => sel.onchange = () => {
    const o = plan.offen[+sel.dataset.i];
    o.wahl = sel.value ? +sel.value : null;
    const pos = $("#dlg-abgleich-inhalt").scrollTop;
    abgleichZeichnen();
    $("#dlg-abgleich-inhalt").scrollTop = pos;
    const neu = $(`#abgl-${sel.dataset.i}`); if (neu) neu.focus();
  });

  const ok = $("#ab-ok");
  ok.disabled = st.doppelt.size > 0;
  $("#ab-hinweis").textContent = st.doppelt.size ? "Bitte doppelte Zuordnungen auflösen." : "";
}

$("#ab-ok").onclick = () => {
  if (!abgleichPlan) return;
  const plan = abgleichPlan;
  const erg = plan.erg;
  const s = abgleichAnwenden(plan);
  abgleichZu();
  importFertig(s, erg);
  if (s.umbenannt) melde(`Liste eingelesen, ${s.umbenannt} Namensänderung${s.umbenannt === 1 ? "" : "en"} übernommen`);
};
$("#ab-abbr").onclick = abgleichZu;
$("#dlg-abgleich-zu").onclick = abgleichZu;
$("#dlg-abgleich").addEventListener("cancel", e => { e.preventDefault(); abgleichZu(); });
$("#dlg-abgleich").addEventListener("close", () => { abgleichPlan = null; verlaufFreigeben(); });

/* ============================================================ Sicherung */

function sicherungHerunterladen() {
  const blob = new Blob([JSON.stringify(Z, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = sicherungsName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  melde("Sicherung heruntergeladen");
}
$("#btn-sichern").onclick = sicherungHerunterladen;

/* ================================================= Neue Gruppe beginnen */

/* Loescht Teilnehmende, Runden, Anwesenheit und Sperrpaare, damit eine
   neue Gruppe ohne alte Begegnungen startet. Das Erscheinungsbild bleibt. */
function neueGruppeOeffnen() {
  const anzahl = (n, eins, mehr) => `${n} ${n === 1 ? eins : mehr}`;
  const aktivN = Z.teilnehmer.filter(t => t.inListe !== false).length;
  const ehemN = Z.teilnehmer.length - aktivN;
  const korrN = Object.values(Z.korrektur || {}).reduce((s, k) => s + Object.keys(k).length, 0);
  $("#dlg-neu-inhalt").innerHTML = `
    <p style="margin:0 0 10px">Damit startest du mit einer leeren Liste für eine neue Gruppe.
      ${Z.kurs ? `Aus <strong>${esc(Z.kurs)}</strong> werden gelöscht:` : "Gelöscht werden:"}</p>
    <ul class="neu-liste">
      <li>${anzahl(aktivN, "Teilnehmer*in", "Teilnehmende")}${ehemN ? ` und ${anzahl(ehemN, "Person", "Personen")} aus früheren Modulen` : ""}</li>
      <li>${anzahl(Z.runden.length, "Runde", "Runden")} mit allen Begegnungen</li>
      ${(Z.sperrpaare || []).length ? `<li>${anzahl(Z.sperrpaare.length, "Sperrpaar", "Sperrpaare")}</li>` : ""}
      ${korrN ? `<li>vor Ort geänderte Anwesenheit</li>` : ""}
    </ul>
    <p class="hilfe" style="margin:0 0 16px">Titel, Fußzeile und Namensformat unter Erscheinungsbild bleiben erhalten.</p>
    <label class="neu-wahl"><input type="checkbox" id="neu-sichern" checked>
      <span>Vorher eine Sicherung herunterladen<br><span class="hilfe" style="margin:0">Damit lässt sich die alte Gruppe später über „Sicherung laden“ wiederherstellen.</span></span></label>`;
  $("#dlg-neu").showModal();
  verlaufMerken("neu");
  $("#dlg-neu-abbr").focus();
}

function neueGruppeZu() { verlaufFreigeben(); if ($("#dlg-neu").open) $("#dlg-neu").close(); }

function neueGruppeBeginnen() {
  const mitSicherung = $("#neu-sichern").checked;
  if (mitSicherung) sicherungHerunterladen();
  const ci = Z.ci;
  Z = leererZustand(); Z.ci = ci;
  speichern();
  editor = null;
  offeneRunden = null; offeneModule = null;
  matrixEhemalige = false;
  einst = { tag: null, modus: einst.modus, wert: einst.wert, variante: 0, label: "" };
  neueGruppeZu();
  zeige("teilnehmer");
  melde(mitSicherung ? "Sicherung heruntergeladen, alle Daten gelöscht. Jetzt die neue Liste einlesen." : "Alle Daten gelöscht. Jetzt die neue Liste einlesen.");
}

$("#dlg-neu-ok").onclick = neueGruppeBeginnen;
$("#dlg-neu-abbr").onclick = neueGruppeZu;
$("#dlg-neu-zu").onclick = neueGruppeZu;
$("#dlg-neu").addEventListener("close", () => {
  verlaufFreigeben();
  const b = $("#btn-neue-gruppe"); if (b) b.focus();
});

/* Dateiname aus dem Kurs, z. B. "Gruppenrotation_CA2609-3_M1_PZG_Erstgespraech.json" */
function sicherungsName() {
  const kurs = String(Z.kurs || "")
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
    .replace(/Ä/g, "Ae").replace(/Ö/g, "Oe").replace(/Ü/g, "Ue").replace(/ß/g, "ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Za-z0-9-]+/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "")
    .slice(0, 80).replace(/_$/, "");
  return kurs ? `Gruppenrotation_${kurs}.json` : "Gruppenrotation.json";
}

$("#datei-sicherung").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = "";
  try {
    const d = JSON.parse(await f.text());
    if (Array.isArray(d.teilnehmer)) {
      if (Z.teilnehmer.length && !confirm("Sicherung laden? Der aktuelle Stand wird komplett ersetzt.\n\nFür ein neues Modul stattdessen zuerst die Sicherung laden und danach „Neues Modul einlesen“ nutzen.")) return;
      Z = Object.assign(leererZustand(), d);
      Z.ci = Object.assign(leererZustand().ci, d.ci || {});
      Z.kurs = d.kurs || "";
      if (!Array.isArray(Z.sperrpaare)) Z.sperrpaare = [];
      rundenModulZuordnen(Z);
      offeneRunden = null; offeneModule = null;
      melde("Sicherung geladen");
    } else if (Array.isArray(d.runden)) {
      // historie.json aus dem Python-Skript: nur Runden uebernehmen
      if (!confirm(`${d.runden.length} Runden aus der Datei übernehmen? Die Nummern müssen zur aktuellen Liste passen.`)) return;
      let id = Z.runden.reduce((m, x) => Math.max(m, x.id), 0);
      for (const r of d.runden) {
        Z.runden.push({
          id: ++id,
          datum: r.datum && /^\d{4}-/.test(r.datum) ? r.datum.split("-").reverse().join(".") : (r.datum || heuteStr()),
          label: r.label || `Runde ${id}`,
          gruppen: r.gruppen.map(g => g.map(Number).sort((a, b) => a - b)),
          fehlend: r.fehlend || []
        });
      }
      melde(`${d.runden.length} Runden übernommen`);
    } else throw new Error();
    speichern(); editor = null; zeichnen();
  } catch {
    melde("Das ist keine Sicherungsdatei dieser Seite. Bitte eine .json-Datei wählen, die über „Sicherung speichern“ entstanden ist.");
  }
};

if (location.hash === "#einteilen" && Z.teilnehmer.length) einteilenOeffnen();
